spring.application.name=module4

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.url=jdbc:mysql://localhost:3306/prod-ready-features?useSSL=false
spring.datasource.username=root
spring.datasource.password=Admin@12345

#disable automatic restart
spring.devtools.restart.enabled=true
#exclude the directory to not trigger the restart
spring.devtools.restart.exclude=com/abhishek/module4/dto/**

# As we are using module2 application as third party so that's why we need to change the port here
# Because both the servers are running on Port 8080
server.port=9000 

employeeService.base.url=http://localhost:8080/

#logging configuration (Default enabled error, warn, info)
# Sequence for levels
# error
# warn
# info
# debug
# trace

# Enable client package classes for till Trace logging (So all logs are enabled)
# DEBUG -> Till debug visible
logging.level.com.abhishek.module4.clients=TRACE

# Only error, warn, info for config package classes
logging.level.com.abhishek.module4.config=INFO

# Application level (i.e root)
# by default it is set to INFO (so error, warn, info will be in the logs)
#logging.level.root = INFO

# formatting the log message
logging.pattern.console=%d{dd-mm-yy hh:MM:ss} [%level] [%c{2.}] --- %m%n

# setting a log file
#logging.file.name=application.log

# configuring the logging
#logging.config=classpath:logback-spring.xml

# Actuator configuration (localhost:PORT/actuator

# Expose all the endpoints offered by actuator
management.endpoints.web.exposure.include=*

# actuator/info
management.info.env.enabled=true
info.app.author=Abhishek
info.app.version=1.0.0

management.endpoint.env.show-values=always
management.info.build.enabled=true
management.info.git.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Open API and Swagger
springdoc.api-docs.enabled=false