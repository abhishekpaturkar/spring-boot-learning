spring:
  application:
    name: module9springai
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5-coder:7b
      embedding:
        model: nomic-embed-text:v1.5
    openai:
      chat:
        model: gpt-4o-mini
        temperature: 0.9
    vectorstore:
      pgvector:
        initialize-schema: true
    chat:
      memory:
        repository:
          jdbc.initialize-schema: always

  
  datasource:
    url: jdbc:postgresql://localhost:5430/vector-db
    username: postgres
    password: Admin12345
    driver-class-name: org.postgresql.Driver

logging:
  level:
    org.springframework.ai:
      chat.client: debug
